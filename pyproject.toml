[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-python-demo"
version = "1.0.0"
description = "DevSecOps GitHub Actions Python demonstration"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1,<4"
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app"]
