name: DAST - OWASP Juice Shop

on:

  workflow_dispatch:

  push:
    branches:
      - main


permissions:
  contents: read
  issues: write


jobs:

  dast:

    name: OWASP Juice Shop DAST

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v6


      # =====================================================
      # 2. Docker Version
      # =====================================================

      - name: Check Docker
        run: |
          docker --version
      # =====================================================
      # 3. Pull Juice Shop
      # =====================================================

      - name: Pull OWASP Juice Shop
        run: |
          docker pull bkimminich/juice-shop
      # =====================================================
      # 4. Start Juice Shop
      # =====================================================

      - name: Start OWASP Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop
      # =====================================================
      # 5. Show Container
      # =====================================================

      - name: Check Container
        run: |
          docker ps
          echo "=============================="
          echo "Juice Shop Container"
          echo "=============================="
          docker ps --filter "name=juice-shop"
      # =====================================================
      # 6. Wait for Application
      # =====================================================

      - name: Wait for Juice Shop
        run: |
          echo "Waiting for Juice Shop..."
          for i in {1..30}; do
            if curl \
              --silent \
              --fail \
              http://127.0.0.1:3000 \
              > /dev/null; then
              echo "================================"
              echo "Juice Shop is UP!"
              echo "================================"
              exit 0
            fi
            echo "Attempt $i: Juice Shop not ready..."
            sleep 2
          done
          echo "================================"
          echo "Juice Shop failed to start"
          echo "================================"
          docker logs juice-shop
          exit 1
      # =====================================================
      # 7. Test Application
      # =====================================================

      - name: Test Juice Shop
        run: |
          echo "Testing Juice Shop..."
          curl --fail \
            http://127.0.0.1:3000 \
            > /dev/null
          echo "Juice Shop is accessible."
      # =====================================================
      # 8. OWASP ZAP DAST
      # =====================================================

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:

          target: "http://127.0.0.1:3000"

          artifact_name: "zap-dast-report"

          fail_action: false


      # =====================================================
      # 9. Show Logs
      # =====================================================

      - name: Show Juice Shop Logs
        if: always()
        run: |
          echo "================================"
          echo "JUICE SHOP LOGS"
          echo "================================"
          docker logs juice-shop || true
      # =====================================================
      # 10. Cleanup
      # =====================================================

      - name: Cleanup Juice Shop
        if: always()
        run: |
          docker stop juice-shop || true
          docker rm juice-shop || true
