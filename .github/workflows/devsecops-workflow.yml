name: DevSecOps Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:

  # ==========================================================
  # JOB 1 - BUILD + TEST + COVERAGE
  # ==========================================================

  build-test:

    name: Build, Test and Coverage

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout source code
      # -------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v6
      # -------------------------------------------------------
      # Setup Python
      # -------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip


      # -------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt


      # -------------------------------------------------------
      # Run Unit Tests + Generate Coverage
      # -------------------------------------------------------

      - name: Run Tests and Generate Coverage
        run: |
          pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov


      # -------------------------------------------------------
      # Upload Coverage Artifact
      # -------------------------------------------------------

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v5
        with:
          name: python-coverage-report
          path: |
            coverage.xml
            htmlcov/


  # ==========================================================
  # JOB 2 - SONARQUBE SAST + QUALITY GATE
  # ==========================================================

  sonarqube:

    name: SonarQube SAST and Quality Gate

    runs-on: ubuntu-latest

    needs: build-test

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # Setup Python
      # -------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip


      # -------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt


      # -------------------------------------------------------
      # Generate coverage again
      # -------------------------------------------------------

      - name: Generate Coverage
        run: |
          pytest \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing


      # -------------------------------------------------------
      # SonarQube Cloud Scan
      # -------------------------------------------------------

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        with:
          args: >
            -Dsonar.qualitygate.wait=true
     # ==========================================================
  # JOB 3 - PYTHON PACKAGE
  # ==========================================================

  package:

    name: Build Python Package

    runs-on: ubuntu-latest

    needs: sonarqube

    steps:

      - name: Checkout Code
        uses: actions/checkout@v6


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install Build Tool
        run: |
          python -m pip install --upgrade pip
          pip install build


      - name: Build Package
        run: |
          python -m build


      - name: Upload Python Package
        uses: actions/upload-artifact@v5
        with:
          name: python-package
          path: dist/


  # ==========================================================
  # JOB 4 - SCA
  # ==========================================================

  sca:

    name: Software Composition Analysis

    runs-on: ubuntu-latest

    needs: sonarqube

    steps:

      - name: Checkout Code
        uses: actions/checkout@v6


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
  # ==========================================================
  # JOB 5 - START APPLICATION
  # ==========================================================

  dast-application:

    name: Start Application for DAST

    runs-on: ubuntu-latest

    needs: package

    steps:

      - name: Checkout Code
        uses: actions/checkout@v6


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # -------------------------------------------------------
      # Start Flask application in background
      # -------------------------------------------------------


      # -------------------------------------------------------
      # ZAP Baseline DAST
      # -------------------------------------------------------

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://www.amazon.com"
          artifact_name: "zap-dast-report"




